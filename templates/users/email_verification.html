{% extends 'base.html' %}

{% block title %}Account{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-10">
    <div class="max-w-2xl mx-auto px-4">
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-3">
                <i class="fas fa-user mr-2 text-primary"></i>My Account
            </h1>
            <div class="bg-green-50 border border-green-200 text-green-800 rounded-lg p-4 flex items-center">
                <i class="fas fa-check-circle text-2xl mr-3"></i>
                <div>
                    <p class="font-semibold">Welcome, {{ user.username }}!</p>
                    <p class="text-sm mt-1">Your account is fully active. You can browse, buy, and sell fish.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
