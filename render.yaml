services:
  - type: web
    name: rechiro
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn rechiro.wsgi:application
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: MPESA_CALLBACK_URL
        value: "https://rechiro.onrender.com/api/mpesa/callback/"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"